<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>StarTrek - StarFleet Command: Online</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    
    <!-- Fallback loading indicator -->
    <div id="loading-fallback" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 24px; font-family: sans-serif; z-index: 9999;">
      Loading Star Trek Fleet Command...
    </div>

    <script type="module" src="/client/main.tsx"></script>
    <script>
      // Remove loading indicator once React loads
      setTimeout(() => {
        const fallback = document.getElementById('loading-fallback');
        if (fallback && document.getElementById('root').hasChildNodes()) {
          fallback.remove();
        }
      }, 1000);
    </script>
  </body>
</html>
